[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pyscroll-lab"
version = "0.1.0"
description = "A small production ML system on a real short-form video channel's data: warehouse, hold predictor, LLM hook scoring, evals, API."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Elijah Samuel" }]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.10",
  "pre-commit>=3.7",
]

[project.scripts]
lab = "pyscroll_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pyscroll_lab"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["pyscroll_lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
